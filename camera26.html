<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera26 - 1 Phone Only</title>
<style>body{font-family:sans-serif;text-align:center;background:#111;color:white}video{width:95%;max-width:400px}canvas{border:3px solid yellow;width:96px;height:96px}button{font-size:20px;padding:12px;margin:6px}#log{color:yellow;text-align:left;padding:10px;font-size:16px}#person{font-size:24px;padding:8px}#timer{font-size:22px;color:#ff0}#diff{font-size:18px;color:#0ff}</style></head>
<body>
<h2>Camera26 - 1 Phone Only!</h2>
<div>Server + Camera + AI = THIS PHONE!</div>
<div>ESP32: 10.91.32.34</div>
<div id="person">⏳ Tap Start...</div>
<div id="timer">Timer: --</div>
<div id="diff">Difference: --</div>
<video id="video" autoplay playsinline muted></video><br>
<button onclick="start()">▶ Start (Use THIS Phone Camera)</button>
<button onclick="setBackground()">📸 Set Background</button>
<button onclick="resetNow()">🔄 Reset</button>
<div id="result">Waiting...</div>
<div>👇 YELLOW BOX:</div>
<canvas id="canvas" width="96" height="96"></canvas>
<div id="log">Log...</div>
<br>
<button onclick="sendManually('/alfon')">ALFON</button>
<button onclick="sendManually('/hans')">HANS</button>
<button onclick="sendManually('/unknown')">UNKNOWN</button>
<script src="edge-impulse-standalone.js"></script>
<script src="run-impulse.js"></script>
<script>
const ESP32="http://10.91.32.34";
const DIFF_THRESHOLD=45, SCAN_TIME=3500;
let lastSent="", confirmCount=0, lastTop="", background=null, personConfirmed=false, personStartTime=0, alreadySent=false, isCoolingDown=false;
function log(m){document.getElementById('log').innerHTML+="<br>"+m;}
function resetNow(){ log("🔄 RESET"); personConfirmed=false; personStartTime=0; alreadySent=false; confirmCount=0; lastTop=""; lastSent=""; isCoolingDown=false; }
function setBackground(){ let c=document.getElementById('canvas');let ctx=c.getContext('2d'); ctx.drawImage(document.getElementById('video'),0,0,96,96); background=ctx.getImageData(0,0,96,96).data.slice(); log("📸 Background saved!"); personConfirmed=false; }
function sendToESP32(path, reason){ log(reason+" -> SENDING: "+path); fetch(ESP32+path+"?t="+Date.now(),{mode:'no-cors'}).catch(e=>{}); let i=new Image(); i.src=ESP32+path+"?t="+Date.now(); lastSent=path; }
function sendManually(p){ log("Manual: "+p); sendToESP32(p,"Manual"); }
async function start(){
  log("Opening THIS phone's BACK camera...");
  try {
    let stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: {ideal:640}, height: {ideal:480} }, audio: false });
    let video = document.getElementById('video');
    video.srcObject = stream;
    await video.play();
    log("✅ BACK Camera ON! This phone is Camera + Server + AI!");
  } catch(e){ log("❌ Camera blocked! Tap Allow, or use Chrome -> Site Settings -> Camera -> Allow"); return; }
  let classifier=new EdgeImpulseClassifier(); await classifier.init();
  log("Model LOADED! Point this phone at EMPTY wall for 2 sec...");
  setTimeout(()=>{
    let c=document.getElementById('canvas');let ctx=c.getContext('2d');
    ctx.drawImage(document.getElementById('video'),0,0,96,96);
    background=ctx.getImageData(0,0,96,96).data.slice();
    log("📸 Background AUTO-saved! Now show a person to this phone!");
  },2000);
  setInterval(async()=>{
    let video=document.getElementById('video');
    if(!video.videoWidth) return;
    let c=document.getElementById('canvas');let ctx=c.getContext('2d');
    ctx.drawImage(video,0,0,96,96);
    let d=ctx.getImageData(0,0,96,96).data;
    let f=[];for(let i=0;i<d.length;i+=4){f.push((d[i]+d[i+1]+d[i+2])/3);}
    let res=classifier.classify(f);
    let alfon=0,hans=0,unknown=0,txt="";
    for(let r of res.results){ txt+=r.label+":"+r.value.toFixed(2)+" "; if(r.label.toLowerCase()=="alfon") alfon=r.value; if(r.label.toLowerCase()=="hans") hans=r.value; if(r.label.toLowerCase()=="unknown") unknown=r.value; }
    document.getElementById('result').textContent=txt+" (from THIS phone)";
    if(isCoolingDown){ document.getElementById('person').textContent="✅ Sent! Cooling down..."; return; }
    if(!background) return;
    let diffSum=0, count=0;
    for(let i=0;i<d.length;i+=16){ diffSum+=Math.abs(d[i]-background[i]); count++; }
    let diffAvg=diffSum/count;
    document.getElementById('diff').textContent="Difference: "+diffAvg.toFixed(1)+" (Need >45)";
    let hasPerson = diffAvg > DIFF_THRESHOLD;
    if(!hasPerson){ document.getElementById('person').textContent="⏳ No Person - Diff "+diffAvg.toFixed(1); document.getElementById('timer').textContent="Timer: NOT started"; personConfirmed=false; personStartTime=0; alreadySent=false; confirmCount=0; lastTop=""; return; }
    if(!personConfirmed){ personConfirmed=true; personStartTime=Date.now(); alreadySent=false; confirmCount=0; lastTop=""; log("✅ PERSON DETECTED! Starting 3.5-sec scan..."); }
    if(alreadySent) return;
    let elapsed=Date.now()-personStartTime;
    let remaining=Math.max(0,SCAN_TIME-elapsed);
    document.getElementById('person').textContent="✅ PERSON! Scanning...";
    document.getElementById('timer').textContent="Scanning: "+(remaining/1000).toFixed(1)+"s left";
    let top="";
    if(alfon>0.50 && alfon>=hans){ top="Alfon"; }
    else if(hans>0.50 && hans>=alfon){ top="Hans"; }
    if(top!=""){
      if(top==lastTop){ confirmCount++; } else { lastTop=top; confirmCount=1; }
      if(confirmCount>=2){ alreadySent=true; isCoolingDown=true; sendToESP32("/"+top.toLowerCase(), "IDENTIFIED: "+top); setTimeout(()=>{ personConfirmed=false; alreadySent=false; confirmCount=0; lastTop=""; lastSent=""; isCoolingDown=false; log("🔄 Ready for NEXT person!"); }, 4000); return; }
    } else { confirmCount=0; }
    if(elapsed>=SCAN_TIME){ alreadySent=true; isCoolingDown=true; sendToESP32("/unknown", "TIMEOUT 3.5 sec -> UNKNOWN"); setTimeout(()=>{ personConfirmed=false; alreadySent=false; confirmCount=0; lastTop=""; lastSent=""; isCoolingDown=false; log("🔄 Ready for NEXT person!"); }, 4000); }
  },1000);
}
</script></body></html>
