<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera36 - ALFON + HANS - RGB FIXED</title>
<style>body{font-family:sans-serif;text-align:center;background:#111;color:white}video{width:95%;max-width:400px}canvas{border:3px solid yellow;width:96px;height:96px}button{font-size:20px;padding:12px;margin:6px}#log{color:yellow;text-align:left;padding:10px;font-size:16px}#person{font-size:24px;padding:8px}#timer{font-size:22px;color:#ff0}#diff{font-size:18px;color:#0ff}#raw{font-size:16px;color:#0f0;background:#222;padding:10px;word-break:break-all}#serverStatus{font-size:20px;padding:10px;background:#333;border-radius:10px;margin:10px}#modelCheck{font-size:20px;padding:10px;background:red}</style></head>
<body>
<h2>Camera36 - ALFON + HANS - RGB FIXED!</h2>
<div id="serverStatus">🔴 Checking Server...</div>
<div>ESP32: 10.91.32.34 | Diff: 55 | RGB + HIGHEST WINS!</div>
<div id="modelCheck">⏳ Checking Model...</div>
<div id="person">⏳ Tap Start...</div>
<div id="timer">Timer: --</div>
<div id="diff">Difference: --</div>
<video id="video" autoplay playsinline muted></video><br>
<button onclick="start()">▶ Start</button>
<button onclick="setBackground()">📸 Set Background</button>
<button onclick="resetNow()">🔄 Reset</button>
<div id="result">Waiting...</div>
<div id="raw">RAW labels will show here...</div>
<div>👇 YELLOW BOX - PUT FACE HERE!</div>
<canvas id="canvas" width="96" height="96"></canvas>
<div id="log">Log...</div>
<br>
<button onclick="sendManually('/alfon')">ALFON</button>
<button onclick="sendManually('/hans')">HANS</button>
<button onclick="sendManually('/unknown')">UNKNOWN</button>
<script src="edge-impulse-standalone.js"></script>
<script src="run-impulse.js"></script>
<script>
const ESP32="http://10.91.32.34";
const DIFF_THRESHOLD=55;
let background=null, personConfirmed=false, personStartTime=0, alreadySent=false, isCoolingDown=false, noPersonCount=0;
function log(m){document.getElementById('log').innerHTML+="<br>"+m;}
function resetNow(){ log("🔄 RESET"); personConfirmed=false; personStartTime=0; alreadySent=false; isCoolingDown=false; noPersonCount=0; }
async function checkServer(){
  try{ await fetch(ESP32+"/ping?t="+Date.now(), {mode:'no-cors'}); document.getElementById('serverStatus').innerHTML="🟢 SERVER CONNECTED - ESP32: 10.91.32.34"; document.getElementById('serverStatus').style.background="green"; }
  catch(e){ document.getElementById('serverStatus').innerHTML="🔴 SERVER NOT CONNECTED! Check OLED IP!"; document.getElementById('serverStatus').style.background="red"; }
}
setInterval(checkServer, 3000); checkServer();
function drawCenterCrop() {
  let video=document.getElementById('video');
  let c=document.getElementById('canvas');let ctx=c.getContext('2d');
  let vw=video.videoWidth, vh=video.videoHeight;
  let s=Math.min(vw, vh);
  let sx=(vw-s)/2, sy=(vh-s)/2;
  ctx.drawImage(video, sx, sy, s, s, 0, 0, 96, 96);
}
function setBackground(){ drawCenterCrop(); let c=document.getElementById('canvas');let ctx=c.getContext('2d'); background=ctx.getImageData(0,0,96,96).data.slice(); log("📸 Background saved!"); personConfirmed=false; }
function sendToESP32(path, reason){ log("➡️ SENDING TO ESP32: "+path+" | "+reason); fetch(ESP32+path+"?t="+Date.now(),{mode:'no-cors'}).catch(e=>{}); let i=new Image(); i.src=ESP32+path+"?t="+Date.now(); }
function sendManually(p){ log("Manual: "+p); sendToESP32(p,"Manual button"); }
function finishScan(){
  alreadySent=true; isCoolingDown=true;
  setTimeout(()=>{ personConfirmed=false; alreadySent=false; isCoolingDown=false; noPersonCount=0; log("🔄 Ready for NEXT person!"); }, 4000);
}
async function start(){
  log("Opening BACK camera...");
  try {
    let stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: {ideal:640}, height: {ideal:480} }, audio: false });
    let video = document.getElementById('video');
    video.srcObject = stream;
    await video.play();
    log("✅ BACK Camera ON!");
  } catch(e){ log("❌ Camera blocked!"); return; }
  let classifier=new EdgeImpulseClassifier(); await classifier.init();
  log("Model LOADED! Point at EMPTY wall 2 sec...");
  setTimeout(()=>{
    drawCenterCrop();
    let c=document.getElementById('canvas');let ctx=c.getContext('2d');
    background=ctx.getImageData(0,0,96,96).data.slice();
    log("📸 Background AUTO-saved!");
  },2000);
  setInterval(async()=>{
    let video=document.getElementById('video');
    if(!video.videoWidth) return;
    drawCenterCrop();
    let c=document.getElementById('canvas');let ctx=c.getContext('2d');
    let d=ctx.getImageData(0,0,96,96).data;
    // ✅ FIX #1: Send RGB - NOT GRAY! 27,648 values!
    let f=[];
    for(let i=0;i<d.length;i+=4){
      f.push(d[i]);     // R
      f.push(d[i+1]);   // G
      f.push(d[i+2]);   // B
    }
    let res=classifier.classify(f);
    document.getElementById('raw').textContent = "RAW: " + JSON.stringify(res.results.map(r=>r.label+":"+r.value.toFixed(2)));
    let hasAlfon=false, hasHans=false, hasKatrina=false;
    let alfon=0, hans=0, unknownScore=0, txt="";
    for(let r of res.results){
      let L=r.label.toLowerCase().trim();
      txt+=r.label+":"+r.value.toFixed(2)+" ";
      if(L==="alfon"){ alfon=r.value; hasAlfon=true; }
      else if(L==="hans"){ hans=r.value; hasHans=true; }
      else if(L==="katrina" || L==="jhon" || L==="jhon carlo"){ hasKatrina=true; }
      else if(L==="unknown" || L==="stranger" || L==="background" || L==="no person" || L==="other"){ unknownScore=r.value; }
    }
    if(hasKatrina){
      document.getElementById('modelCheck').innerHTML="❌ WRONG MODEL! This is KATRINA model!";
      document.getElementById('modelCheck').style.background="red";
    } else if(hasAlfon && hasHans){
      document.getElementById('modelCheck').innerHTML="✅ CORRECT MODEL! ALFON/HANS model loaded! RGB Mode!";
      document.getElementById('modelCheck').style.background="green";
    }
    document.getElementById('result').textContent=txt;
    if(isCoolingDown){ document.getElementById('person').textContent="✅ Sent! Cooling down..."; return; }
    if(!background) return;
    let diffSum=0, count=0;
    for(let i=0;i<d.length;i+=16){ diffSum+=Math.abs(d[i]-background[i]); count++; }
    let diffAvg=diffSum/count;
    document.getElementById('diff').textContent="Difference: "+diffAvg.toFixed(1)+" (Need >55)";
    let hasPerson = diffAvg > DIFF_THRESHOLD;
    if(!hasPerson){
      noPersonCount++;
      if(noPersonCount>=3 && !alreadySent){
        document.getElementById('person').textContent="⏳ No Person - Diff "+diffAvg.toFixed(1);
        document.getElementById('timer').textContent="Timer: NOT started";
        personConfirmed=false; personStartTime=0; alreadySent=false; noPersonCount=0;
      }
      return;
    }
    noPersonCount=0;
    if(!personConfirmed){ personConfirmed=true; personStartTime=Date.now(); alreadySent=false; log("✅ PERSON DETECTED!"); }
    if(alreadySent) return;
    let elapsed=Date.now()-personStartTime;
    let remaining=Math.max(0,1500-elapsed);
    // ✅ FIX #2: Show WHO is winning RIGHT NOW!
    let currentWinner = "UNKNOWN";
    if(alfon > hans && alfon > unknownScore) currentWinner="ALFON";
    else if(hans > alfon && hans > unknownScore) currentWinner="HANS";
    document.getElementById('person').textContent="✅ PERSON! Now Winning: "+currentWinner+" | ALFON:"+alfon.toFixed(2)+" HANS:"+hans.toFixed(2)+" UNKNOWN:"+unknownScore.toFixed(2);
    document.getElementById('timer').textContent="Wait: "+(remaining/1000).toFixed(1)+"s then send highest";
    if(elapsed>=1500){
      // ✅ FIX #3: TRUE HIGHEST WINS - No Tie Bias!
      let maxScore = Math.max(alfon, hans, unknownScore);
      if(maxScore === alfon){
        sendToESP32("/alfon", "HIGHEST: ALFON "+alfon.toFixed(2)+" > HANS "+hans.toFixed(2)+" > UNKNOWN "+unknownScore.toFixed(2));
      } else if(maxScore === hans){
        sendToESP32("/hans", "HIGHEST: HANS "+hans.toFixed(2)+" > ALFON "+alfon.toFixed(2)+" > UNKNOWN "+unknownScore.toFixed(2));
      } else {
        sendToESP32("/unknown", "HIGHEST: UNKNOWN "+unknownScore.toFixed(2)+" > ALFON "+alfon.toFixed(2)+" > HANS "+hans.toFixed(2));
      }
      finishScan();
    }
  },1000);
}
</script></body></html>
