<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face Door - Final</title>
<style>
body{font-family:sans-serif;text-align:center;background:#111;color:white}
video{width:95%;max-width:400px;border-radius:12px;border:3px solid #555}
button{font-size:20px;padding:12px;margin:6px;border-radius:10px}
#result{font-size:22px;font-weight:bold;margin:10px}
#log{color:yellow;text-align:left;padding:10px;font-size:16px}
</style>
</head>
<body>
<h2>Face Door - Final</h2>
<video id="video" autoplay playsinline muted></video><br>
<button onclick="start()">▶ Start Camera + AI</button>
<div id="result">Waiting...</div>
<div id="log">Log...</div>
<canvas id="canvas" width="96" height="96" style="display:none"></canvas><br>
<button onclick="sendToESP('/alfon')">ALFON - Green</button>
<button onclick="sendToESP('/hans')">HANS - Blue</button>
<button onclick="sendToESP('/unknown')">UNKNOWN - Red</button>

<script src="edge-impulse-standalone.js"></script>
<script src="run-impulse.js"></script>
<script>
const ESP32 = "http://192.168.18.225";
let lastSend = 0;
function log(m){ document.getElementById('log').innerHTML += "<br>" + m; }
function sendToESP(p){ fetch(ESP32 + p, {mode:"no-cors"}); }

async function start(){
  log("1. Button tapped");
  let video = document.getElementById('video');
  let classifier;
  try{
    log("2. Starting camera...");
    let stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}});
    video.srcObject = stream;
    log("3. ✅ Camera OK!");
  }catch(e){ log("❌ Camera ERROR: " + e.message); return; }

  try{
    log("4. Loading model...");
    classifier = new EdgeImpulseClassifier();
    await classifier.init();
    log("5. ✅ Model LOADED! Checking every 0.5 sec...");
  }catch(e){ log("❌ Model ERROR: " + e.message); return; }

  setInterval(async ()=>{
    try{
      let c = document.getElementById('canvas');
      let ctx = c.getContext('2d');
      ctx.drawImage(video, 0, 0, 96, 96);
      let d = ctx.getImageData(0, 0, 96, 96).data;
      let features = [];
      for(let i=0;i<d.length;i+=4){
        features.push((d[i]+d[i+1]+d[i+2])/3/255);
      }
      let res = classifier.classify(features);
      let top = "", score = 0, txt = "";
      for(let r of res.results){
        txt += r.label + ":" + r.value.toFixed(2) + " ";
        if(r.value > score){ score = r.value; top = r.label; }
      }
      document.getElementById('result').textContent = txt + " => " + top + " | " + new Date().toLocaleTimeString();

      // Send if confidence > 0.40 and 2 sec passed since last send
      if(score > 0.40 && Date.now() - lastSend > 2000){
        lastSend = Date.now();
        if(top === "Alfon") sendToESP('/alfon');
        else if(top === "Hans") sendToESP('/hans');
        else if(top === "unknown") sendToESP('/unknown');
        log("Sent: " + top + " " + score.toFixed(2));
      }
    }catch(e){ log("Classify error: " + e.message); }
  }, 500);
}
</script>
</body>
</html>
