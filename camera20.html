<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera20 Auto Reset</title>
<style>body{font-family:sans-serif;text-align:center;background:#111;color:white}video{width:95%;max-width:400px}canvas{border:3px solid yellow;width:96px;height:96px}button{font-size:20px;padding:12px;margin:6px}#log{color:yellow;text-align:left;padding:10px;font-size:16px}#person{font-size:24px;padding:8px}#timer{font-size:22px;color:#ff0}</style></head>
<body>
<h2>Camera20 - Auto Reset, No Stuck</h2>
<div id="person">⏳ Waiting for Person...</div>
<div id="timer">Timer: --</div>
<video id="video" autoplay playsinline muted></video><br>
<button onclick="start()">▶ Start</button>
<button onclick="resetNow()">🔄 Reset / Next Person</button>
<div id="result">Waiting...</div>
<div>👇 YELLOW BOX:</div>
<canvas id="canvas" width="96" height="96"></canvas>
<div id="log">Log...</div>
<br>
<button onclick="sendManually('/alfon')">ALFON</button>
<button onclick="sendManually('/hans')">HANS</button>
<button onclick="sendManually('/unknown')">UNKNOWN</button>
<script src="edge-impulse-standalone.js"></script>
<script src="run-impulse.js"></script>
<script>
const ESP32="http://192.168.18.225";
let lastSent="", confirmCount=0, lastTop="", video, faceDetector=null;
let personConfirm=0, personConfirmed=false, personStartTime=0, alreadySent=false, noFaceCount=0, isCoolingDown=false;
function log(m){document.getElementById('log').innerHTML+="<br>"+m;}
function resetNow(){
  log("🔄 MANUAL RESET - Ready for next person");
  personConfirm=0; personConfirmed=false; personStartTime=0; alreadySent=false; confirmCount=0; lastTop=""; lastSent=""; isCoolingDown=false; noFaceCount=0;
  document.getElementById('person').textContent="⏳ Waiting for Person...";
  document.getElementById('timer').textContent="Timer: --";
}
function sendToESP32(path, reason){
  log(reason+" -> SENDING: "+path+" -> LED ON 3 SEC");
  fetch(ESP32+path+"?t="+Date.now(),{mode:'no-cors'}).catch(e=>{});
  let img=new Image(); img.src=ESP32+path+"?t="+Date.now();
  lastSent=path;
}
function sendManually(p){ log("Manual: "+p); sendToESP32(p,"Manual"); }
async function start(){
  video=document.getElementById('video');
  let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}});
  video.srcObject=stream; video.muted=true; await video.play();
  log("Camera OK!");
  try{ if('FaceDetector' in window){ faceDetector=new FaceDetector({fastMode:true,maxDetectedFaces:1}); log("FaceDetector ON"); } else { log("FaceDetector NOT supported - Fallback ON"); } }catch(e){ log("FaceDetector error - fallback"); }
  let classifier=new EdgeImpulseClassifier(); await classifier.init();
  log("Model LOADED! Auto-reset after 4 sec - No stuck!");
  setInterval(async()=>{
    let c=document.getElementById('canvas');let ctx=c.getContext('2d');
    ctx.drawImage(video,0,0,96,96);

    // ALWAYS update numbers - even when cooling down, so it never looks stuck!
    let d0=ctx.getImageData(0,0,96,96).data;
    let f0=[];for(let i=0;i<d0.length;i+=4){f0.push((d0[i]+d0[i+1]+d0[i+2])/3);}
    let res0=classifier.classify(f0);
    let a0=0,h0=0,u0=0,txt0="";
    for(let r of res0.results){ txt0+=r.label+":"+r.value.toFixed(2)+" "; if(r.label.toLowerCase()=="alfon") a0=r.value; if(r.label.toLowerCase()=="hans") h0=r.value; if(r.label.toLowerCase()=="unknown") u0=r.value; }
    document.getElementById('result').textContent=txt0+" (live)";

    // If cooling down after a send, just wait 4 sec then auto-reset
    if(isCoolingDown){
      document.getElementById('person').textContent="✅ Sent! Cooling down 4 sec...";
      document.getElementById('timer').textContent="Next person in a few seconds...";
      return;
    }

    // STEP 0: MUST DETECT PERSON FIRST
    let hasPerson=true;
    if(faceDetector){
      try{ let faces=await faceDetector.detect(video); hasPerson=faces.length>0; }catch(e){ hasPerson=true; }
    }
    if(!hasPerson){
      document.getElementById('person').textContent="⏳ No Person - Waiting for face...";
      document.getElementById('person').style.color="white";
      document.getElementById('timer').textContent="Timer: --";
      personConfirm=0; personConfirmed=false; personStartTime=0; alreadySent=false; confirmCount=0; lastTop="";
      noFaceCount++;
      if(noFaceCount==3 && lastSent!="/noface"){ fetch(ESP32+"/noface?t="+Date.now(),{mode:'no-cors'}).catch(e=>{}); let i=new Image(); i.src=ESP32+"/noface?t="+Date.now(); lastSent="/noface"; }
      return;
    }
    noFaceCount=0;

    if(!personConfirmed){
      personConfirm++;
      document.getElementById('person').textContent="👀 Person maybe? Confirming... "+personConfirm+"/2";
      document.getElementById('person').style.color="#ff0";
      document.getElementById('timer').textContent="Timer: Not started yet...";
      if(personConfirm>=2){
        personConfirmed=true; personStartTime=Date.now(); alreadySent=false; confirmCount=0; lastTop="";
        log("✅ PERSON CONFIRMED! Starting 3-sec scan...");
      }
      return;
    }

    if(alreadySent){
      // Should not happen now - cooling down handles it, but just in case
      return;
    }

    let elapsed=Date.now()-personStartTime;
    let remaining=Math.max(0,3000-elapsed);
    document.getElementById('person').textContent="✅ PERSON Confirmed! Scanning...";
    document.getElementById('person').style.color="#0f0";
    document.getElementById('timer').textContent="Scanning: "+(remaining/1000).toFixed(1)+"s left";

    let top="",score=0;
    if(a0>0.50 && a0>=h0){ top="Alfon"; score=a0; }
    else if(h0>0.50 && h0>=a0){ top="Hans"; score=h0; }

    if(top!=""){
      if(top==lastTop){ confirmCount++; } else { lastTop=top; confirmCount=1; }
      if(confirmCount>=2){
        alreadySent=true; isCoolingDown=true;
        sendToESP32("/"+top.toLowerCase(), "IDENTIFIED in "+(elapsed/1000).toFixed(1)+"s: "+top+" "+score.toFixed(2));
        // AUTO-RESET after 4 sec - DON'T wait for person to leave!
        setTimeout(()=>{ log("🔄 Auto-reset done - Ready for NEXT person!"); personConfirm=0; personConfirmed=false; personStartTime=0; alreadySent=false; confirmCount=0; lastTop=""; lastSent=""; isCoolingDown=false; }, 4000);
        return;
      }
    } else { confirmCount=0; }

    if(elapsed>=3000){
      alreadySent=true; isCoolingDown=true;
      document.getElementById('timer').textContent="⏰ Timeout 3 sec! -> UNKNOWN";
      sendToESP32("/unknown", "TIMEOUT 3 sec - Not Alfon/Hans (Alfon "+a0.toFixed(2)+" Hans "+h0.toFixed(2)+" Unknown "+u0.toFixed(2)+")");
      // AUTO-RESET after 4 sec - DON'T wait for person to leave!
      setTimeout(()=>{ log("🔄 Auto-reset done - Ready for NEXT person!"); personConfirm=0; personConfirmed=false; personStartTime=0; alreadySent=false; confirmCount=0; lastTop=""; lastSent=""; isCoolingDown=false; }, 4000);
    }
  },1000);
}
</script></body></html>
